<style>
/* Layout: one reading column; sticky header with date + section chips; text set like a sefer */
:root{
  --paper:#f6f7fa; --surface:#ffffff; --ink:#1a2133; --muted:#5b6479; --line:#dde1ea;
  --accent:#8f6212; --accent-soft:#f4ecdb; --rashi:#f0f2f7; --done:#2c7a4b;
  --f-text:"Frank Ruhl Libre","David Libre","Times New Roman",serif;
  --f-ui:"Assistant","Segoe UI",Arial,sans-serif;
  --size:1.32rem;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#10131b; --surface:#161a24; --ink:#e7e4dc; --muted:#9aa2b6; --line:#272d3b;
  --accent:#d8a746; --accent-soft:#2a2314; --rashi:#1b202c; --done:#5cbc84; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10131b; --surface:#161a24; --ink:#e7e4dc; --muted:#9aa2b6; --line:#272d3b;
  --accent:#d8a746; --accent-soft:#2a2314; --rashi:#1b202c; --done:#5cbc84; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0}
.wrap{max-width:760px;margin:0 auto}
.row1{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-text);font-weight:700;font-size:1.25rem;letter-spacing:.01em}
.brand small{display:block;font-family:var(--f-ui);font-weight:400;font-size:.75rem;color:var(--muted)}
.actions{display:flex;gap:6px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px}
.datebar{display:flex;align-items:center;gap:8px;margin-top:10px}
.datebar .nav{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.9rem}
.dateinfo{flex:1;min-width:0;text-align:center}
.hdate{font-family:var(--f-text);font-size:1.35rem;font-weight:700;line-height:1.2}
.gdate{color:var(--muted);font-size:.85rem}
.badge{display:inline-block;margin-top:2px;font-size:.75rem;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:600;font-size:.9rem;display:flex;gap:6px;align-items:center}
.chip[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .tick{width:16px;height:16px;border-radius:50%;border:1.5px solid currentColor;display:inline-grid;place-items:center;font-size:10px;opacity:.55}
.chip.done .tick{background:var(--done);border-color:var(--done);color:#fff;opacity:1}
.progress{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:-1px}
.progress i{display:block;height:100%;background:var(--done);width:0;transition:width .3s}

main{padding-block:16px 40px;padding-inline:16px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tool{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 10px;font-size:.85rem}
.tool[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.sec{scroll-margin-top:200px}
.sep{border:0;border-top:2px solid var(--line);margin:40px 0}
.sec-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.sec-head > div{min-width:0}
.sec-head h1{font-family:var(--f-text);font-size:1.7rem;margin:0;line-height:1.2;text-wrap:balance}
.sec-head .sub{color:var(--muted);margin-top:2px}
.done-btn{flex:none;border:1.5px solid var(--done);color:var(--done);background:transparent;border-radius:999px;padding:6px 14px;font-weight:700}
.done-btn[aria-pressed="true"]{background:var(--done);color:#fff}

.text{font-family:var(--f-text);font-size:var(--size);line-height:1.9}
.text h2{font-family:var(--f-ui);font-size:.8rem;letter-spacing:.06em;color:var(--accent);margin:26px 0 8px;font-weight:700;
  display:flex;align-items:center;gap:10px}
.text h2::after{content:"";flex:1;height:1px;background:var(--line)}
.text h2:first-child{margin-top:0}
.v{margin:0 0 .55em}
.vn{font-family:var(--f-ui);font-size:.62em;color:var(--accent);font-weight:700;margin-inline-end:.35em;vertical-align:.25em}
.flow .v{display:inline;margin:0}
.flow .v::after{content:" "}
.rashi{font-size:.8em;line-height:1.75;background:var(--rashi);border-radius:8px;padding:8px 12px;margin:-.2em 0 .9em}
.rashi .lbl{font-family:var(--f-ui);font-size:.75em;font-weight:700;color:var(--accent);margin-inline-end:.4em}
.src{margin-top:22px;padding-top:10px;border-top:1px solid var(--line);color:var(--muted);font-size:.8rem}
.msg{padding:24px;border:1px dashed var(--line);border-radius:12px;text-align:center;color:var(--muted);font-family:var(--f-ui);font-size:1rem}
.msg button{margin-top:10px}
.sk{height:1.1em;background:var(--line);border-radius:6px;margin:.7em 0;opacity:.6;animation:p 1.2s infinite alternate}
@keyframes p{to{opacity:.25}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}.progress i{transition:none}}

.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;padding-block:0 24px;padding-inline:16px}
.links a{display:grid;gap:2px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 16px;text-decoration:none}
.links a b{font-family:var(--f-text);font-size:1.1rem}
.links a span{color:var(--accent);font-size:.85rem;font-weight:600}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(440px,calc(100% - 32px))}
dialog::backdrop{background:rgba(10,12,20,.45)}
.dlg{padding:18px 18px 14px;display:grid;gap:14px}
.dlg h3{margin:0;font-size:1.1rem}
.field{display:grid;gap:4px}
.field label,.lab{font-weight:600;font-size:.9rem}
.field select,.field input[type=date]{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--paper)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.checks label,.sw{display:flex;gap:6px;align-items:center;font-size:.9rem}
.hint{color:var(--muted);font-size:.8rem}
.offline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dlg-foot{display:flex;gap:8px}
.primary{background:var(--ink);color:var(--paper);border:0;border-radius:8px;padding:7px 16px;font-weight:700}
footer{color:var(--muted);font-size:.78rem;text-align:center;padding:0 16px calc(30px + env(safe-area-inset-bottom,0px))}
footer a{color:inherit}
.status{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);color:var(--ink);border:1px solid var(--accent);border-radius:10px;padding:8px 12px;margin-bottom:14px;font-size:.9rem}
.status button{flex:none}
.he{direction:rtl;unicode-bidi:isolate}
.msg a{color:var(--accent);font-weight:600}
.dlg-row{display:flex;gap:8px;flex-wrap:wrap}
.links button{display:grid;gap:2px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 16px;text-align:start;font:inherit}
.links button b{font-size:1.05rem}
.links button span{color:var(--accent);font-size:.85rem;font-weight:600}
.stars{display:flex;gap:4px;direction:ltr;justify-content:flex-start}
.stars input{position:absolute;opacity:0;width:1px;height:1px}
.stars label{font-size:1.9rem;line-height:1;color:var(--line);cursor:pointer;padding:0 2px}
.stars label.on{color:var(--accent)}
.stars input:focus-visible + label{outline:2px solid var(--accent);border-radius:4px}
.field textarea,.field input[type=text]{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--paper);font:inherit;color:var(--ink);width:100%}
.field textarea{min-height:110px;resize:vertical}
.fbmsg{font-size:.9rem;min-height:1.2em}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="row1">
      <div class="brand"><span class="he">יום ביומו</span><small data-t="brandSub"></small></div>
      <div class="actions">
        <button class="icon-btn" id="installBtn" data-t="install" hidden></button>
        <button class="icon-btn" id="themeBtn" data-ta="theme">◐</button>
        <button class="icon-btn" id="setBtn" data-t="settings"></button>
      </div>
    </div>
    <div class="datebar">
      <button class="nav" id="prevDay" data-t="prev"></button>
      <div class="dateinfo">
        <div class="hdate he" id="hdate">&nbsp;</div>
        <div class="gdate" id="gdate">&nbsp;</div>
        <span class="badge" id="badge" hidden></span>
      </div>
      <button class="nav" id="nextDay" data-t="next"></button>
    </div>
    <nav class="chips" id="chips" role="tablist"></nav>
    <div class="progress" aria-hidden="true"><i id="prog"></i></div>
  </div>
</header>

<main class="wrap" id="main">
  <div class="status" id="status" role="status" hidden><span id="statusText"></span><button class="tool" id="statusRetry" data-t="retry"></button></div>
  <div id="content"></div>
</main>

<aside class="wrap links" id="links">
  <a id="hayomLink" href="https://www.chabad.org/dailystudy/hayomyom.asp" target="_blank" rel="noopener"><b class="he">היום יום</b><span data-t="hayomSub"></span></a>
  <a href="https://dvarmalchus.org/" target="_blank" rel="noopener"><b class="he">דבר מלכות</b><span data-t="dmSub"></span></a>
  <button type="button" id="fbOpen"><b data-t="fbCard"></b><span data-t="fbCardSub"></span></button>
</aside>
<footer><span data-t="footTexts"></span> <a href="https://www.sefaria.org" target="_blank" rel="noopener">Sefaria</a> · <span data-t="footDates"></span> <a href="https://www.hebcal.com" target="_blank" rel="noopener">Hebcal</a><br><span data-t="privacy"></span></footer>

<dialog id="fbDlg">
  <form method="dialog" class="dlg" id="fbForm">
    <h3 data-t="fbTitle"></h3>
    <div class="field">
      <span class="lab" id="fbRateLab" data-t="fbRating"></span>
      <div class="stars" role="radiogroup" aria-labelledby="fbRateLab" id="fbStars"></div>
    </div>
    <div class="field">
      <label for="fbText" data-t="fbMessage"></label>
      <textarea id="fbText" maxlength="2000" dir="auto"></textarea>
    </div>
    <div class="field">
      <label for="fbContact" data-t="fbContact"></label>
      <input type="text" id="fbContact" maxlength="120" dir="auto" autocomplete="email">
      <span class="hint" data-t="fbContactHint"></span>
    </div>
    <div class="fbmsg" id="fbMsg" role="status"></div>
    <div class="dlg-foot"><button type="button" class="primary" id="fbSend" data-t="fbSend"></button><button value="cancel" class="tool" data-t="close"></button></div>
  </form>
</dialog>

<dialog id="dlg">
  <form method="dialog" class="dlg" id="setForm">
    <h3 data-t="settings"></h3>
    <div class="field">
      <label for="langSel" data-t="language"></label>
      <select id="langSel"><option value="he">עברית</option><option value="fr">Français</option></select>
    </div>
    <div class="field">
      <label for="dateIn" data-t="goDate"></label>
      <input type="date" id="dateIn">
    </div>
    <div class="field">
      <label for="city" data-t="cityLabel"></label>
      <select id="city"></select>
    </div>
    <label class="sw"><input type="checkbox" id="afterSunset"> <span data-t="afterSunset"></span></label>
    <div class="field">
      <span class="lab" data-t="sectionsLabel"></span>
      <div class="checks" id="secChecks"></div>
    </div>
    <div class="field">
      <span class="lab" data-t="offlineLabel"></span>
      <div class="offline"><button type="button" class="tool" id="prefetchBtn" data-t="prefetchBtn"></button><span class="hint" id="prefetchMsg" data-t="prefetchHint"></span></div>
    </div>
    <div class="hint" data-t="savedHint"></div>
    <div class="dlg-foot"><button class="primary" value="ok" data-t="save"></button><button value="cancel" class="tool" data-t="cancel"></button></div>
  </form>
</dialog>

/* Chabad monthly Tehillim cycle by Hebrew day of month */
const TEHILLIM = [[1,9],[10,17],[18,22],[23,28],[29,34],[35,38],[39,43],[44,48],[49,54],[55,59],

const T = {

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const pad = n => String(n).padStart(2,"0");
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parts = iso => iso.split("-").map(Number);
const addDays = (iso,n) => { const [y,m,d] = parts(iso); return isoOf(new Date(y,m-1,d+n)); };
const weekday = iso => { const [y,m,d] = parts(iso); return new Date(y,m-1,d).getDay(); };

function gem(n){
  n = Number(n); if(!n || n<1) return String(n);
  const ones=["","א","ב","ג","ד","ה","ו","ז","ח","ט"], tens=["","י","כ","ל","מ","נ","ס","ע","פ","צ"], hund=["","ק","ר","ש","ת"];
  let s="", h=Math.floor(n/100); while(h>4){ s+="ת"; h-=4; } s+=hund[h];
  const r=n%100; s += r===15 ? "טו" : r===16 ? "טז" : tens[Math.floor(r/10)]+ones[r%10];
  return s.length===1 ? s+"׳" : s.slice(0,-1)+"״"+s.slice(-1);
}

/* ---------- network: timeout, retries, status banner ---------- */
class NetError extends Error { constructor(kind, host, msg){ super(msg||kind); this.kind = kind; this.host = host; } }
const down = new Set();
function setStatus(){
  const el = $("#status");
  if(!navigator.onLine){ $("#statusText").textContent = t("statusOffline"); el.hidden = false; return; }
  if(down.has("sefaria")){ $("#statusText").textContent = t("statusSef"); el.hidden = false; return; }
  if(down.has("hebcal")){ $("#statusText").textContent = t("errHebcal"); el.hidden = false; return; }
  el.hidden = true;
}
async function net(url){
  const host = url.includes("sefaria.org") ? "sefaria" : "hebcal";
  let last = null;
  for(let i=0;i<3;i++){
    const ac = new AbortController(), tm = setTimeout(()=>ac.abort(), 15000);
    try{
      const r = await fetch(url, {signal:ac.signal}); clearTimeout(tm);
      if(r.ok){ const j = await r.json(); if(down.delete(host)) setStatus(); return j; }
      if(r.status===404 || r.status===400) throw new NetError("notfound", host, "HTTP "+r.status);
      last = new NetError("down", host, "HTTP "+r.status);
    }catch(e){
      clearTimeout(tm);
      if(e.kind==="notfound") throw e;
      last = new NetError(navigator.onLine ? "down" : "offline", host, e.message);
    }
    if(!navigator.onLine) break;
    await sleep(1500*(i+1));
  }
  if(last.kind==="down"){ down.add(host); setStatus(); }
  throw last;
}

async function hebDate(iso){
  const k = "c:h:"+iso; const c = store.get(k); if(c) return c;
  const j = await net(`${HEB}/converter?cfg=json&date=${iso}&g2h=1&strict=1&lg=he`);
  const v = {hd:j.hd, hm:j.hm, hy:j.hy, hebrew:j.hebrew};
  store.set(k, v); return v;
}
async function calendar(iso){
  const dia = city().il ? 0 : 1;
  const k = `c:cal2:${iso}:${dia}`; const c = store.get(k); if(c) return c;
  const [y,m,d] = parts(iso);
  const j = await net(`${SEF}/calendars?year=${y}&month=${m}&day=${d}&diaspora=${dia}&timezone=${encodeURIComponent(city().tz)}`);
  const items = (j.calendar_items||[]).map(i=>({order:i.order, ref:i.ref, he:i.displayValue?.he||"", en:i.displayValue?.en||"", aliyot:i.extraDetails?.aliyot||null}));
  store.set(k, items); return items;
}
async function fetchText(ref, version="hebrew"){
  const k = `c:t:${version}:${ref}`; const c = store.get(k); if(c) return c;
  const j = await net(`${SEF}/v3/texts/${encodeURIComponent(ref)}?version=${encodeURIComponent(version)}`);
  const v = (j.versions||[])[0] || {};
  const out = {ref:j.ref||ref, heRef:j.heRef||"", sections:j.sections||[], text:v.text ?? [], vt:v.versionTitle||"", lic:v.license||""};
  store.set(k, out); return out;
}
async function sunsetPassed(iso){
  const c = city();
  try{

}

/* ---------- text shaping ---------- */
function clean(raw){
  if(Array.isArray(raw)) return raw.map(clean).filter(Boolean).join(" ");
  if(raw==null) return "";
  const doc = new DOMParser().parseFromString("<div>"+String(raw)+"</div>","text/html");
  doc.querySelectorAll("sup.footnote-marker, i.footnote, .footnote, i[data-overlay], i[data-commentator]").forEach(e=>e.remove());
  const walk = n => { let s=""; n.childNodes.forEach(ch=>{
      if(ch.nodeType===3) s += esc(ch.nodeValue);
      else if(ch.nodeType===1){ const tg=ch.tagName; if(tg==="BR") s+=" "; else if(tg==="B"||tg==="STRONG"||tg==="BIG") s+="<b>"+walk(ch)+"</b>"; else s+=walk(ch); }
    }); return s; };
  return walk(doc.body.firstChild).replace(/\{[פס]\}/g,"").replace(/\s+/g," ").trim();
}
function chapLabel(first, i){
  if(first==null) return null;
  const m = String(first).match(/^(\d+)([ab])?$/); if(!m) return String(first);
  if(m[2]){ const idx = Number(m[1])*2 + (m[2]==="b"?1:0) + i; return {daf:Math.floor(idx/2), amud:idx%2}; }
  return Number(m[1]) + i;
}
/* Sefaria v3 text -> rows {c, v, raw} */
function rowsOf(tx){
  const s = tx.sections || [], X = tx.text, out = [];
  const twoD = Array.isArray(X) && X.some(Array.isArray);
  if(twoD){
    X.forEach((chap,i)=>{ const arr = Array.isArray(chap) ? chap : [chap];
      const start = i===0 && s.length>1 ? Number(s[1]) : 1;
      arr.forEach((x,j)=>{ if(x && (!Array.isArray(x) || x.length)) out.push({c:chapLabel(s[0],i), v:start+j, raw:x}); }); });
  } else {
    const arr = Array.isArray(X) ? X : [X];
    const start = s.length>1 ? Number(s[1]) : 1;
    arr.forEach((x,j)=>{ if(x) out.push({c:chapLabel(s[0],0), v:start+j, raw:x}); });
  }
  return out;
}
const cKey = c => typeof c==="object" && c ? `${c.daf}${c.amud}` : String(c);
const cName = (c, head) => typeof c==="object" && c ? `דף ${gem(c.daf)} עמוד ${c.amud ? "ב" : "א"}` : `${head} ${gem(c)}`;
function group(rows, head, titleFor){
  const groups = []; let last = null;
  rows.forEach(r=>{ const k = (titleFor ? titleFor(r) : "") + "|" + cKey(r.c);
    if(k!==last){ groups.push({title: titleFor ? titleFor(r) : cName(r.c, head), rows:[]}); last=k; }
    groups[groups.length-1].rows.push(r); });
  return groups;
}

/* ---------- section loaders: return {sub, groups:[{title, rows}], src:[{vt,lic}], link?} ---------- */
/* Chabad divides some parashot differently from Sefaria (checked against chabad.org) */
const CHABAD_ALIYOT = {"Nasso": {5:"Numbers 7:42-7:83", 6:"Numbers 7:84-7:89"}};
const HOLIDAY = /Pesach|Sukkot|Shavuot|Rosh Hashan|Yom Kippur|Atzeret|Simchat|Chol ?ha ?Moed/i;

const LOADERS = {
  async chumash(ctx){
    /* When the coming Shabbat has a holiday reading, Chabad studies the next regular parasha. */
    let it = ctx.cal.find(i=>i.order===1);
    for(let wk=1; it && HOLIDAY.test(it.en||"") && wk<=3; wk++){
      it = (await calendar(addDays(ctx.iso, 7*wk))).find(i=>i.order===1);
    }
    if(!it || !it.aliyot || !it.aliyot.length) throw new Error(t("errNoParasha"));
    const idx = Math.min(weekday(ctx.iso), 6, it.aliyot.length-1);
    const ref = (CHABAD_ALIYOT[it.en] && CHABAD_ALIYOT[it.en][idx]) || it.aliyot[idx];
    const tx = await fetchText(ref, "hebrew|Tanach with Nikkud");
    const rows = rowsOf(tx);
    const book = ref.replace(/\s+\d.*$/,"");
    const rashi = {}; let rsrc = null;
    await Promise.all([...new Set(rows.map(r=>r.c))].map(async c=>{
      try{ const rt = await fetchText(`Rashi on ${book} ${c}`); rashi[c] = Array.isArray(rt.text) ? rt.text : []; rsrc = rt; }catch{ rashi[c] = []; }
    }));
    rows.forEach(r=>{ const x = (rashi[r.c]||[])[r.v-1]; r.rashi = Array.isArray(x) ? x.map(clean).filter(Boolean) : (x ? [clean(x)] : []); });
    return {sub:t("chumashSub")(it, idx, tx.heRef), groups:group(rows,"פרק"), src:[tx, rsrc].filter(Boolean)};
  },
  async tehillim(ctx){
    const {hd} = ctx.h, nextHd = ctx.hNext ? ctx.hNext.hd : null;
    const short = hd===29 && nextHd===1;
    const e = short ? [140,150] : TEHILLIM[Math.min(hd,30)-1];
    const ref = Array.isArray(e) ? `Psalms ${e[0]}-${e[1]}` : `Psalms ${e}`;
    const tx = await fetchText(ref, "hebrew|Tanach with Nikkud");
    return {sub:t("tehSub")(hd, short, tx.heRef), groups:group(rowsOf(tx),"מזמור"), src:[tx]};
  },
  async tanya(ctx){
    const a = (ctx.cal.find(i=>i.order===15)||{}).ref;
    if(!a) throw new Error(t("errNoTanya"));
    const b = (ctx.calNext.find(i=>i.order===15)||{}).ref;
    const P = r => { const m = String(r||"").match(/^(Tanya, Part [IVX]+; .+?) (\d+)(?::(\d+))?$/); return m ? {book:m[1], ch:+m[2], seg:m[3] ? +m[3] : 1} : null; };
    const A = P(a), B = P(b);
    if(!A){ const tx = await fetchText(a); return {sub:tx.heRef, groups:group(rowsOf(tx),"פרק"), src:[tx]}; }
    const rows = [], srcs = []; let heBook = "";
    const take = async (book, ch, from, to) => { const tx = await fetchText(`${book} ${ch}`); srcs.push(tx); if(!heBook) heBook = tx.heRef.replace(/\s+\S+$/,"");
      rowsOf(tx).forEach(r=>{ if(r.v>=from && r.v<to) rows.push(r); }); };
    if(B && B.book===A.book && B.ch===A.ch) await take(A.book, A.ch, A.seg, B.seg);
    else {
      await take(A.book, A.ch, A.seg, Infinity);
      if(B && B.book===A.book){ for(let c=A.ch+1; c<B.ch; c++) await take(A.book, c, 1, Infinity); if(B.seg>1) await take(B.book, B.ch, 1, B.seg); }
      else if(B && B.seg>1) await take(B.book, B.ch, 1, B.seg);
    }
    if(!rows.length) throw new Error(t("errNoTanya"));
    const f = rows[0], l = rows[rows.length-1], name = (heBook || "תניא").replace(/^תניא,\s*/,"");
    const range = f.c===l.c
      ? `${name} ${gem(f.c)}, ${f.v===l.v ? gem(f.v) : gem(f.v)+"–"+gem(l.v)}`
      : `${name} ${gem(f.c)}:${gem(f.v)} – ${gem(l.c)}:${gem(l.v)}`;
    return {sub:range, groups:group(rows,"פרק"), src:srcs.slice(0,1)};
  },
  async rambam3(ctx){ return rambam(ctx, 7); },
  async rambam1(ctx){ return rambam(ctx, 6); },
  async seferhamitzvot(ctx){
    /* Daily schedule from Hebcal (Chabad cycle, aligned with Rambam 3 chapters); texts from Sefaria */
    const k = "c:sm:"+ctx.iso; let title = store.get(k);
    if(!title){
      const j = await net(`${HEB}/hebcal?v=1&cfg=json&dsm=on&start=${ctx.iso}&end=${ctx.iso}`);
      const it = (j.items||[]).find(i=>i.category==="seferHaMitzvot");
      if(!it) throw new Error(t("errNoSM"));
      title = it.title; store.set(k, title);
    }
    const m = String(title).match(/^Day\s+(\d+):\s*(.*)$/);
    const day = m ? +m[1] : null, body = m ? m[2] : String(title);
    const [y,mo,d] = parts(ctx.iso);
    const link = `https://www.chabad.org/dailystudy/seferHamitzvos.asp?tdate=${mo}/${d}/${y}`;
    const refs = smRefs(body);
    if(!refs) return {sub:t("smSub")(day), groups:[], src:[], link, note:body};
    const groups = []; let src = null;
    for(const r of refs){
      const tx = await fetchText(r.ref); src = src || tx;
      group(rowsOf(tx), r.head, row=>`${r.head} ${gem(row.c)}`).forEach(g=>groups.push(g));
    }
    return {sub:t("smSub")(day), groups, src:src ? [src] : []};
  },
  async mishna(ctx){
    const it = ctx.cal.find(i=>i.order===5); if(!it) throw new Error(t("errNoMishna"));
    const tx = await fetchText(it.ref);
    return {sub:tx.heRef, groups:group(rowsOf(tx),"פרק"), src:[tx]};
  },
  async daf(ctx){
    const it = ctx.cal.find(i=>i.order===3); if(!it) throw new Error(t("errNoDaf"));
    const tx = await fetchText(it.ref);
    return {sub:it.he || tx.heRef, groups:group(rowsOf(tx),"דף"), src:[tx]};
  }
};
/* "P1, N1, P2" / "N10-N12" / "Principle 1-3" -> Sefaria refs; null when the day is an introduction */
function smRefs(body){
  const out = [];
  for(const part of String(body).split(/\s*,\s*/).filter(Boolean)){
    let m;
    if((m = part.match(/^([PN])(\d+)(?:\s*-\s*[PN]?(\d+))?$/))){
      const pos = m[1]==="P";
      out.push({ref:`Sefer HaMitzvot, ${pos ? "Positive" : "Negative"} Commandments ${m[2]}${m[3] ? "-"+m[3] : ""}`, head: pos ? "מצוות עשה" : "מצוות לא תעשה"});
    } else if((m = part.match(/^Principles?\s+(\d+)(?:\s*-\s*(\d+))?$/i))){
      out.push({ref:`Sefer HaMitzvot, Shorashim ${m[1]}${m[2] ? "-"+m[2] : ""}`, head:"שורש"});
    } else return null;
  }
  return out.length ? out : null;
}
async function rambam(ctx, order){
  const items = ctx.cal.filter(i=>i.order===order); if(!items.length) throw new Error(t("errNoRambam"));
  const groups = [], src = [], subs = [];
  for(const it of items){
    const tx = await fetchText(it.ref); src.push(tx); subs.push(it.he || tx.heRef);
    const book = (it.he||"").replace(/\s+\S+$/,"");
    group(rowsOf(tx),"פרק", r=>`${book} · פרק ${gem(r.c)}`).forEach(g=>groups.push(g));
  }
  return {sub:subs.join(" · "), groups, src:src.slice(0,1)};
}

/* ---------- context per date ---------- */
const ctxCache = new Map();
function getCtx(iso){
  const key = iso+":"+settings.city;
  if(!ctxCache.has(key)){
    const next = addDays(iso,1);
    const p = Promise.all([calendar(iso), calendar(next), hebDate(iso), hebDate(next).catch(()=>null)])
      .then(([cal, calNext, h, hNext])=>({iso, cal, calNext, h, hNext}));
    p.catch(()=>ctxCache.delete(key));
    ctxCache.set(key, p);
  }
  return ctxCache.get(key);
}
const secCache = new Map();
function loadSection(id, iso){
  const key = `${iso}:${id}:${settings.city}:${settings.lang}`;
  if(!secCache.has(key)){
    const p = getCtx(iso).then(ctx=>LOADERS[id](ctx));
    p.catch(()=>secCache.delete(key));
    secCache.set(key, p);
  }
  return secCache.get(key);
}

  document.documentElement.dir = fr ? "ltr" : "rtl";
  document.querySelectorAll("[data-t]").forEach(el=>{ const v = t(el.dataset.t); if(typeof v==="string") el.textContent = v; });
  document.querySelectorAll("[data-ta]").forEach(el=>el.setAttribute("aria-label", t(el.dataset.ta)));
  $("#badge").textContent = t("badge");
  setStatus();
}
function renderChips(){
  const done = getDone(state.iso), vis = visible();
  $("#chips").innerHTML = vis.map(s=>`<button class="chip${done[s.id] ? " done" : ""}" role="tab" id="chip-${s.id}" aria-selected="${!settings.all && s.id===state.active}" data-id="${s.id}"><span class="tick">✓</span>${esc(secShort(s))}</button>`).join("");
  const n = vis.filter(s=>done[s.id]).length;
  $("#prog").style.width = vis.length ? (100*n/vis.length)+"%" : "0";
}
const skeleton = () => `<div class="sk" style="width:60%"></div><div class="sk"></div><div class="sk"></div><div class="sk" style="width:85%"></div><div class="sk"></div>`;
function shell(sec){
  const done = !!getDone(state.iso)[sec.id];
  return `<section class="sec" id="s-${sec.id}" data-id="${sec.id}">
    <div class="sec-head"><div><h1>${esc(secTitle(sec))}</h1><div class="sub">&nbsp;</div></div>
    <button class="done-btn" data-done="${sec.id}" aria-pressed="${done}">${done ? t("doneOn") : t("done")}</button></div>
    <div class="text he${sec.flow ? " flow" : ""}">${skeleton()}</div></section>`;
}
function toolsBar(list){
  return `<div class="tools">
    <button class="tool" id="tAll" aria-pressed="${settings.all}">${t("all")}</button>
    ${list.some(s=>s.id==="chumash") ? `<button class="tool" id="tRashi" aria-pressed="${settings.rashi}">${t("rashi")}</button>` : ""}
    <button class="tool" id="tNikud" aria-pressed="${settings.nikud}">${t("nikud")}</button>
    <button class="tool" id="tSmaller" aria-label="${t("smaller")}">A−</button>
    <button class="tool" id="tBigger" aria-label="${t("bigger")}">A+</button>
    <button class="tool" id="tShare">${t("share")}</button></div>`;
}
function textHTML(sec, data){
  if(!data.groups.length && data.link)
    return `<div class="msg">${esc(t("smOther"))} <span class="he">${esc(data.note||"")}</span><br><a href="${data.link}" target="_blank" rel="noopener">${esc(t("smLink"))}</a></div>`;
  const strip = s => settings.nikud ? s : s.replace(/[֑-ֽֿ-ׂׄ-ׇ]/g,"");
  return data.groups.map(g=>`<h2>${esc(g.title)}</h2>` + (sec.flow ? "<p>" : "") +
    g.rows.map(r=>{
      const tag = sec.flow ? "span" : "p";
      const num = g.rows.length>1 || sec.id!=="seferhamitzvot" ? `<span class="vn">${gem(r.v)}</span>` : "";
      let h = `<${tag} class="v">${num}${strip(clean(r.raw))}</${tag}>`;
      if(sec.id==="chumash" && settings.rashi && r.rashi && r.rashi.length) h += `<div class="rashi"><span class="lbl">רש״י</span>${strip(r.rashi.join(" "))}</div>`;
      return h;
    }).join("") + (sec.flow ? "</p>" : "")).join("") +
    (data.src.length ? `<div class="src" dir="auto">${t("source")}: Sefaria — ${data.src.map(s=>esc(s.vt)+(s.lic ? " ("+esc(s.lic)+")" : "")).join(" · ")}</div>` : "");
}
function errText(e){
  if(e && e.kind==="offline") return t("errOffline");
  if(e && e.kind==="down") return e.host==="hebcal" ? t("errHebcal") : t("errDown");
  return (e && e.message) || t("errLoad");
}
async function fill(el, sec, iso, my){
  try{
    const data = await loadSection(sec.id, iso);
    if(my!==state.token) return;
    const sub = el.querySelector(".sub"); sub.textContent = data.sub; sub.dir = "auto";
    el.querySelector(".text").innerHTML = textHTML(sec, data);
  }catch(e){
    if(my!==state.token) return;
    el.querySelector(".text").innerHTML = `<div class="msg" dir="auto">${esc(errText(e))}<br><button class="tool" data-retry="1">${t("retry")}</button></div>`;
  }
}
function render(){
  const my = ++state.token, vis = visible();
  if(!vis.length){ $("#content").innerHTML = `<div class="msg">${t("none")}</div>`; renderChips(); return; }
  if(!vis.some(s=>s.id===state.active)) state.active = vis[0].id;
  const list = settings.all ? vis : [SECTIONS.find(s=>s.id===state.active)];
  $("#content").innerHTML = toolsBar(list) + list.map(shell).join(`<hr class="sep">`);
  list.forEach(sec=>fill($("#s-"+sec.id), sec, state.iso, my));
  renderChips();
}

async function setDate(iso, auto=false){
  state.iso = iso; state.auto = auto; state.hebrew = "";
  const [y,m,d] = parts(iso);
  $("#gdate").textContent = `${t("days")[weekday(iso)]} · ${d}.${m}.${y}`;
  $("#hdate").innerHTML = "&nbsp;";
  $("#badge").hidden = !auto;
  $("#hayomLink").href = `https://www.chabad.org/dailystudy/hayomyom.asp?tdate=${m}/${d}/${y}`;
  render(); window.scrollTo({top:0});
  try{ const h = await hebDate(iso); if(state.iso===iso){ state.hebrew = h.hebrew; $("#hdate").textContent = h.hebrew; } }
  catch{ if(state.iso===iso) $("#hdate").textContent = ""; }
}
async function goToday(){
  let iso = isoOf(new Date()), auto = false;
  if(settings.afterSunset && await sunsetPassed(iso)){ iso = addDays(iso,1); auto = true; }
  setDate(iso, auto);
}

/* ---------- share ---------- */
async function share(btn){
  const iso = state.iso, url = `${SITE}?d=${iso}`;
  btn.disabled = true;
  const lines = [];
  for(const s of visible()){
    try{ const d = await Promise.race([loadSection(s.id, iso), sleep(4000).then(()=>null)]); lines.push(`• ${secTitle(s)}${d && d.sub ? " — "+d.sub : ""}`); }
    catch{ lines.push(`• ${secTitle(s)}`); }
  }
  btn.disabled = false;
  const text = `${t("shareHead")(state.hebrew || iso)}\n${lines.join("\n")}`;
  if(navigator.share){
    try{ await navigator.share({title:t("shareTitle"), text, url}); return; }
    catch(e){ if(e && e.name==="AbortError") return; }
  }
  window.open("https://wa.me/?text="+encodeURIComponent(text+"\n"+url), "_blank", "noopener");
}

/* ---------- offline: save the next days ---------- */
async function prefetch(days){
  const msg = $("#prefetchMsg"), btn = $("#prefetchBtn"); btn.disabled = true;
  const start = state.iso || isoOf(new Date()); let ok = 0, fail = 0; const total = days * visible().length;
  for(let i=0;i<days;i++){
    const iso = addDays(start,i);
    for(const s of visible()){
      let done = false;
      for(let attempt=0; attempt<3 && !done; attempt++){
        try{ await loadSection(s.id, iso); done = true; }
        catch{ await sleep(4000*(attempt+1)); }
      }
      done ? ok++ : fail++;
      msg.textContent = t("progress")(ok, total);
      await sleep(700); /* stay gentle with Sefaria */
    }
  }
  msg.textContent = fail ? t("prefFail")(ok, fail) : t("prefDone")(ok, days);
  btn.disabled = false;
}

/* ---------- events ---------- */
$("#chips").addEventListener("click", e=>{
  const b = e.target.closest(".chip"); if(!b) return;
  state.active = b.dataset.id;
  if(settings.all){ const el = $("#s-"+b.dataset.id); if(el) el.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); renderChips(); }
  else { render(); window.scrollTo({top:0}); }
});
$("#content").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.done){
    const id = b.dataset.done, d = getDone(state.iso); d[id] = !d[id]; store.set("done:"+state.iso, d);
    b.setAttribute("aria-pressed", d[id]); b.textContent = d[id] ? t("doneOn") : t("done"); renderChips();
    const nxt = d[id] && visible().find(s=>!d[s.id]);
    if(nxt){
      if(settings.all){ const el = $("#s-"+nxt.id); if(el) setTimeout(()=>el.scrollIntoView({behavior:"smooth"}), 250); }
      else setTimeout(()=>{ state.active = nxt.id; render(); window.scrollTo({top:0}); }, 350);
    }
  }
  if(b.dataset.retry){ down.clear(); setStatus(); render(); }
  if(b.id==="tAll"){ settings.all = !settings.all; saveSettings(); render(); }
  if(b.id==="tRashi"){ settings.rashi = !settings.rashi; saveSettings(); render(); }
  if(b.id==="tNikud"){ settings.nikud = !settings.nikud; saveSettings(); render(); }
  if(b.id==="tShare"){ share(b); }
  if(b.id==="tBigger"||b.id==="tSmaller"){ settings.size = Math.min(2.2, Math.max(1, +(settings.size + (b.id==="tBigger" ? .1 : -.1)).toFixed(2))); saveSettings(); applyTheme(); }
});
$("#statusRetry").onclick = ()=>{ down.clear(); setStatus(); render(); };
addEventListener("online", ()=>{ setStatus(); render(); });
addEventListener("offline", setStatus);
$("#prevDay").onclick = ()=>setDate(addDays(state.iso,-1));
$("#nextDay").onclick = ()=>setDate(addDays(state.iso,1));
$("#themeBtn").onclick = ()=>{
  const dark = settings.theme ? settings.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  settings.theme = dark ? "light" : "dark"; saveSettings(); applyTheme();
};
$("#setBtn").onclick = ()=>{
  $("#langSel").value = settings.lang;
  $("#city").innerHTML = CITIES.map(c=>`<option value="${c.id}"${c.id===settings.city ? " selected" : ""}>${esc(c[settings.lang]||c.he)}${c.il ? "" : t("abroad")}</option>`).join("");
  $("#afterSunset").checked = settings.afterSunset;
  $("#dateIn").value = state.iso;
  $("#secChecks").innerHTML = SECTIONS.map(s=>`<label><input type="checkbox" id="sc-${s.id}" value="${s.id}"${settings.sections.includes(s.id) ? " checked" : ""}> ${esc(secTitle(s))}</label>`).join("");
  $("#prefetchMsg").textContent = t("prefetchHint");
  $("#dlg").showModal();
};
$("#prefetchBtn").onclick = ()=>prefetch(7);
$("#dlg").addEventListener("close", ()=>{
  if($("#dlg").returnValue!=="ok") return;
  settings.lang = $("#langSel").value === "fr" ? "fr" : "he";
  settings.city = $("#city").value;
  settings.afterSunset = $("#afterSunset").checked;
  settings.sections = [...document.querySelectorAll("#secChecks input:checked")].map(i=>i.value);
  saveSettings(); applyLang();
  const picked = $("#dateIn").value;
  setDate(picked || state.iso, picked && picked!==state.iso ? false : state.auto);
});
document.addEventListener("keydown", e=>{
  if(e.target.closest && e.target.closest("input,select,dialog")) return;
  const rtl = document.documentElement.dir === "rtl";
  if(e.key==="ArrowRight") (rtl ? $("#prevDay") : $("#nextDay")).click();
  if(e.key==="ArrowLeft") (rtl ? $("#nextDay") : $("#prevDay")).click();
});

/* ---------- install (PWA) ---------- */
let installEvt = null;
addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); installEvt = e; $("#installBtn").hidden = false; });
$("#installBtn").onclick = async ()=>{ if(!installEvt) return; installEvt.prompt(); try{ await installEvt.userChoice; }catch{} installEvt = null; $("#installBtn").hidden = true; };
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("/sw.js").catch(()=>{});

/* ---------- anonymous visit count + feedback ---------- */
const onSite = location.protocol==="https:" && !/^(localhost|127\.)/.test(location.hostname);
function deviceId(){
  let id = store.get("uid");
  if(!id){ id = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2,10)); store.set("uid", id); }
  return id;
}
function ping(){
  if(!onSite || navigator.doNotTrack==="1") return;
  const day = isoOf(new Date());
  if(store.get("ping")===day) return;
  fetch("/api/ping", {method:"POST", headers:{"content-type":"application/json"}, keepalive:true,
    body:JSON.stringify({uid:deviceId(), lang:settings.lang, city:settings.city, standalone:matchMedia("(display-mode: standalone)").matches})})
    .then(r=>{ if(r.ok) store.set("ping", day); }).catch(()=>{});
}
let fbRating = 0;
function drawStars(){
  $("#fbStars").innerHTML = [1,2,3,4,5].map(n=>`<input type="radio" name="fbr" id="fbr${n}" value="${n}"${n===fbRating?" checked":""}><label for="fbr${n}" class="${n<=fbRating?"on":""}" aria-label="${n}/5">★</label>`).join("");
}
$("#fbStars").addEventListener("change", e=>{ fbRating = Number(e.target.value)||0; drawStars(); $("#fbr"+fbRating).focus(); });
$("#fbOpen").onclick = ()=>{ fbRating = 0; drawStars(); $("#fbText").value = ""; $("#fbContact").value = ""; $("#fbMsg").textContent = ""; $("#fbSend").disabled = false; $("#fbDlg").showModal(); };
$("#fbSend").onclick = async ()=>{
  const message = $("#fbText").value.trim(), contact = $("#fbContact").value.trim(), msg = $("#fbMsg");
  if(!fbRating && !message){ msg.textContent = t("fbEmpty"); return; }
  if(!onSite){ msg.textContent = t("fbErr"); return; }
  $("#fbSend").disabled = true; msg.textContent = t("fbSending");
  try{
    const r = await fetch("/api/feedback", {method:"POST", headers:{"content-type":"application/json"},
      body:JSON.stringify({uid:deviceId(), rating:fbRating||null, message, contact, lang:settings.lang, page:state.active||""})});
    if(r.ok){ msg.textContent = t("fbThanks"); setTimeout(()=>$("#fbDlg").close(), 1600); return; }
    msg.textContent = r.status===429 ? t("fbTooMany") : t("fbErr");
  }catch{ msg.textContent = t("fbErr"); }
  $("#fbSend").disabled = false;
};

/* ---------- start ---------- */
applyTheme(); applyLang(); ping();
const linked = new URLSearchParams(location.search).get("d");
if(linked && /^\d{4}-\d{2}-\d{2}$/.test(linked) && !isNaN(Date.parse(linked))) setDate(linked);
else goToday();
</script>
